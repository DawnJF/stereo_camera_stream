<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AR Seethrough Stream (Agora)</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <style>
        html,
        body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }

        #log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            max-width: 80%;
            max-height: 200px;
            overflow-y: auto;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="ui-container">
        <button id="startBtn">Start AR Stream</button>
    </div>

    <div id="log"></div>

    <video id="video" autoplay playsinline muted style="display: none;"></video>
    <canvas id="renderCanvas"></canvas>

    <script src="./ar_index.js"></script>
</body>

</html>
