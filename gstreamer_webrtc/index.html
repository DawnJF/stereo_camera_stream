<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AR Seethrough Stream (GStreamer)</title>
    <script src="/vendor/babylon.js"></script>
    <style>
        html,
        body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="ui-container">
        <button id="startBtn">Start AR Stream</button>
    </div>

    <video id="video" autoplay playsinline muted style="display: none;"></video>
    <canvas id="renderCanvas"></canvas>

    <script>
        // --- 配置参数 ---
        const ENABLE_SBS = false; // SBS 开关：true=开启SBS模式, false=关闭SBS模式
        const ENABLE_HAND_TRACKING = false; // 手部追踪开关：true=开启手部追踪, false=关闭手部追踪

        // Signaling Mode: 'http' (direct to local server) or 'ws' (via relay server)
        // This value is replaced by the server if needed, or defaults to 'http'
        const SIGNALING_MODE = '{{SIGNALING_MODE}}';

        // Toggle Google STUN via URL param `useStun` (example: ?useStun=true)
        // 默认在局域网（不使用 Google STUN）
        const USE_GOOGLE_STUN = (new URLSearchParams(window.location.search).get('useStun') === 'true');
        var pc = null;
        var video = document.getElementById('video');
        var ws = null;
        var candidateQueue = [];
        var wsAttempt = 0;
        var wsConnectingAtMs = 0;
        var wsConnectTimeoutId = null;

        function createPeerConnection() {
            var iceServers = USE_GOOGLE_STUN ? [{ urls: ['stun:stun.l.google.com:19302'] }] : [];
            var config = {
                sdpSemantics: 'unified-plan',
                iceServers: iceServers
            };
            console.log('PeerConnection iceServers:', iceServers.length ? 'Google STUN enabled' : 'LAN-only (no STUN)');
            pc = new RTCPeerConnection(config);
            pc.ontrack = function (evt) {
                if (evt.track.kind == 'video') {
                    video.srcObject = new MediaStream([evt.track]);
                    video.play();
                }
            };
        }

        function negotiate() {
            return pc.createOffer().then(offer => pc.setLocalDescription(offer))
                .then(() => {
                    return new Promise(resolve => {
                        if (pc.iceGatheringState === 'complete') resolve();
                        else {
                            function check() {
                                if (pc.iceGatheringState === 'complete') {
                                    pc.removeEventListener('icegatheringstatechange', check);
                                    resolve();
                                }
                            }
                            pc.addEventListener('icegatheringstatechange', check);
                        }
                    });
                })
                .then(() => {
                    return fetch('/offer', {
                        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
                        headers: { 'Content-Type': 'application/json' },
                        method: 'POST'
                    });
                })
                .then(resp => resp.json())
                .then(answer => pc.setRemoteDescription(answer));
        }

        function connectWebSocket() {
            if (!pc) return;
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const wsUrl = `${protocol}://${window.location.host}/ws`;
            console.log("Connecting to WS:", wsUrl, "focus=", document.hasFocus(), "visibility=", document.visibilityState);

            if (ws) {
                if (ws.readyState === WebSocket.OPEN) return;
                if (ws.readyState === WebSocket.CONNECTING) {
                    const ageMs = wsConnectingAtMs ? (performance.now() - wsConnectingAtMs) : 0;
                    if (ageMs < 4000) return;
                    try { ws.close(); } catch (_) { }
                    ws = null;
                }
            }

            const attemptId = ++wsAttempt;
            const currentWs = new WebSocket(wsUrl);
            ws = currentWs;
            wsConnectingAtMs = performance.now();
            if (wsConnectTimeoutId) clearTimeout(wsConnectTimeoutId);
            wsConnectTimeoutId = setTimeout(() => {
                if (ws !== currentWs) return;
                if (currentWs.readyState !== WebSocket.CONNECTING) return;
                console.warn("WS connect timeout, retrying", { attemptId });
                try { currentWs.close(); } catch (_) { }
                ws = null;
                wsConnectTimeoutId = null;
                connectWebSocket();
            }, 4000);
            candidateQueue = [];

            ws.onopen = () => {
                if (ws !== currentWs) return;
                if (wsConnectTimeoutId) { clearTimeout(wsConnectTimeoutId); wsConnectTimeoutId = null; }
                console.log("WS Connected, registering as viewer");
                ws.send(JSON.stringify({ type: "register", role: "viewer" }));
                // Give it a moment to register, then start negotiation
                setTimeout(initiateOffer, 500);
            };

            ws.onerror = (event) => {
                if (ws !== currentWs) return;
                console.error("WS Error:", event, "readyState=", ws ? ws.readyState : null);
            };

            ws.onclose = (event) => {
                if (ws !== currentWs) return;
                if (wsConnectTimeoutId) { clearTimeout(wsConnectTimeoutId); wsConnectTimeoutId = null; }
                console.warn("WS Closed:", { code: event.code, reason: event.reason, wasClean: event.wasClean });
                ws = null;
            };

            ws.onmessage = async (event) => {
                if (ws !== currentWs) return;
                const msg = JSON.parse(event.data);
                console.log("WS Message:", msg.type);

                if (msg.type === "answer") {
                    await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
                    while (candidateQueue.length > 0) {
                        const candidate = candidateQueue.shift();
                        try {
                            await pc.addIceCandidate(candidate);
                        } catch (e) {
                            console.error("Error adding queued candidate", e);
                        }
                    }
                } else if (msg.type === "candidate") {
                    if (msg.candidate) {
                        if (!pc.remoteDescription) {
                            candidateQueue.push(msg.candidate);
                            return;
                        }
                        try {
                            await pc.addIceCandidate(msg.candidate);
                        } catch (e) {
                            console.error("Error adding candidate", e);
                        }
                    }
                }
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "candidate",
                        candidate: event.candidate
                    }));
                }
            };

            async function initiateOffer() {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({
                    type: "offer",
                    sdp: pc.localDescription.sdp
                }));
            }
        }

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            // AR 模式下背景通常需要透明
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

            const camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 0, 0), scene);

            const videoTexture = new BABYLON.VideoTexture("videoTexture", video, scene, true);
            // 根据 SBS 开关设置纹理缩放
            videoTexture.uScale = ENABLE_SBS ? 0.5 : 1.0; // SBS 模式：0.5，普通模式：1.0
            videoTexture.uOffset = ENABLE_SBS ? 0 : 0;    // SBS 模式显示左半部分，普通模式不偏移

            // 创建一个平面显示视频
            const plane = BABYLON.MeshBuilder.CreatePlane("videoPlane", { width: 2, height: 1.125 }, scene);
            const mat = new BABYLON.StandardMaterial("videoMat", scene);
            mat.diffuseTexture = videoTexture;
            mat.emissiveColor = new BABYLON.Color3(1, 1, 1);
            mat.disableLighting = true;
            mat.backFaceCulling = false;
            plane.material = mat;

            // 固定在相机前方 (HUD 效果)
            scene.onBeforeRenderObservable.add(() => {
                if (scene.activeCamera) {
                    plane.parent = scene.activeCamera;
                    plane.position.set(0, -0.3, 1.3); // 距离相机 2.2 米
                    plane.rotation.set(Math.PI / 10, 0, Math.PI / 2);
                }
            });

            if (navigator.xr && window.isSecureContext) {
                let arSupported = false;
                try {
                    arSupported = await navigator.xr.isSessionSupported('immersive-ar');
                } catch (e) {
                    arSupported = false;
                }

                if (arSupported) {
                    try {
                        const xr = await scene.createDefaultXRExperienceAsync({
                            uiOptions: {
                                sessionMode: "immersive-ar",
                            }
                        });
                        if (!ENABLE_HAND_TRACKING && xr && xr.baseExperience && xr.baseExperience.featuresManager) {
                            const fm = xr.baseExperience.featuresManager;
                            fm.disableFeature(BABYLON.WebXRFeatureName.HAND_TRACKING);
                        }
                        console.log("AR initialized");
                    } catch (e) {
                        console.log("AR init skipped");
                    }
                } else {
                    console.log("WebXR immersive-ar not supported, skipping AR init");
                }
            } else {
                console.log("WebXR unavailable or insecure context, skipping AR init");
            }

            return scene;
        };

        const startBtn = document.getElementById('startBtn');
        let startRequested = false;

        const start = async () => {
            if (startRequested) return;
            startRequested = true;
            console.log("Start requested", "focus=", document.hasFocus(), "visibility=", document.visibilityState);
            startBtn.style.display = 'none';
            createPeerConnection();
            pc.addTransceiver('video', { direction: 'recvonly' });

            if (SIGNALING_MODE === 'ws') {
                connectWebSocket();
                const scene = await createScene();
                engine.runRenderLoop(() => scene.render());
            } else {
                // HTTP mode (default/local)
                await negotiate();
                const scene = await createScene();
                engine.runRenderLoop(() => scene.render());
            }
        };

        startBtn.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            console.log("Start button pointerdown");
            start();
        }, { passive: false });

        startBtn.addEventListener('touchstart', (event) => {
            event.preventDefault();
            console.log("Start button touchstart");
            start();
        }, { passive: false });

        startBtn.addEventListener('click', () => start());

        const ensureWsConnected = (reason) => {
            if (!startRequested) return;
            if (SIGNALING_MODE !== 'ws') return;
            if (!ws || ws.readyState === WebSocket.CLOSED) {
                console.log("Ensuring WS connected:", reason, "focus=", document.hasFocus(), "visibility=", document.visibilityState);
                connectWebSocket();
            }
        };

        window.addEventListener('focus', () => ensureWsConnected('focus'));
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') ensureWsConnected('visibilitychange');
        });
        window.addEventListener('pointerdown', () => ensureWsConnected('pointerdown'), { once: true });

        window.addEventListener("resize", () => engine.resize());
    </script>
</body>

</html>
